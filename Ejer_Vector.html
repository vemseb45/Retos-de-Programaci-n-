    <script>

    let notas = [];
    

    for (let i = 0; i < 5; i++) {
        let calificaciones = parseInt(prompt("Ingrese Calificaciones " + (i+1) ));
        notas.push(calificaciones);
        }
        
        
        console.log(notas);

        

    </script>
