<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>interaccion con los input</title>
</head>
<body>
<!--Interacion con los elemntos en pantalla-->

<table>
    <tr>
        <th>Fila 1</th>
        <th>Fila 2</th>
    </tr>
<tr>
    <td>dato 1</td>
    <td>dato 2</td>
</tr>

</table>



    
<label for="numero2">Ingrese el primer numero</label>
    <input type="number" name="" id="num1">

<label for="numero2">Ingrese el segundo numero</label>
        <input type="number" name="" id="num2">

<p>resultado
<span id="resultado">aca sale el resultado</span></p>

<button onclick="sumar()">Sumar</button>


<script>

    function sumar() 
    {
    let numero1 = parseFloat(document.getElementById("num1").value);
    let numero2 = parseFloat(document.getElementById("num2").value);
    let sumar = numero1+numero2;

    document.getElementById("resultado").textContent = sumar;

    }

</script>
</body>
</html>
