<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arryas</title>
</head>
<body>
    <script>


        let matriz_Uno_Array = [];
        let matriz_Dos_Array = [];
        

        for (let i = 0; i < 6; i++) {
            let numero = parseInt(prompt("Ingrese número " + (i+1) + " para Matriz Uno:"));
            matriz_Uno_Array.push(numero);
        } 

         alert("Pasamos a la Matriz Dos");


        for (let i =0; i <6; i++){
            let numero_Dos = parseInt(prompt("Ingrese número " + (i+1) + " para Matriz Uno:"));
            matriz_Dos_Array.push(numero_Dos);
        } 


        console.log("Matriz Uno: ", matriz_Uno_Array);
        console.log("Matriz Dos: ", matriz_Dos_Array);

        


        
        





    </script>



    
</body>
</html>
